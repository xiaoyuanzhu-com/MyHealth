name: MyHealth
options:
  bundleIdPrefix: org.foss.myhealth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

targets:
  MyHealth:
    type: application
    platform: iOS
    sources:
      - path: MyHealth
        excludes:
          - "Info.plist"
          - "MyHealth.entitlements"
    resources:
      - path: MyHealth/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.foss.myhealth.ios
        INFOPLIST_FILE: MyHealth/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MyHealth/MyHealth.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  MyHealthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MyHealth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.foss.myhealth.ios.tests
        GENERATE_INFOPLIST_FILE: YES
